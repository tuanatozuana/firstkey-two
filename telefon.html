<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefon - Mini Oyunlar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Telefon Kasası */
        #phone {
            width: 360px; height: 640px;
            background: url('duvar-kagidi.jpg') no-repeat center center;
            background-size: cover;
            border: 12px solid #333;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Ekran Katmanları */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white; display: none; flex-direction: column; align-items: center;
        }
        .active { display: flex; }

        /* Kilit Ekranı */
        #lock-screen { justify-content: center; backdrop-filter: blur(5px); }
        #lock-screen input { padding: 10px; border-radius: 10px; border: none; text-align: center; margin-bottom: 10px; font-size: 18px; width: 60%; }
        #lock-screen button { padding: 10px 20px; border-radius: 10px; border: none; background: #007bff; color: white; cursor: pointer; font-size: 16px;}

        /* Ana Ekran */
        #home-screen { padding-top: 40px; background: rgba(0, 0, 0, 0.4); }
        .score-board { background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; }
        .apps { display: flex; flex-direction: column; gap: 12px; width: 85%; }
        .app-icon { background: rgba(255,255,255,0.2); padding: 12px; border-radius: 15px; text-align: center; cursor: pointer; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); font-size: 16px; font-weight: bold; transition: 0.2s;}
        .app-icon:hover { background: rgba(255,255,255,0.4); }

        /* Mavi Kalp Barı */
        .heart-bar {
            margin-top: 10px;
            padding: 14px;
            border-radius: 18px;
            background: rgba(0, 123, 255, 0.2);
            border: 2px solid rgba(0, 123, 255, 0.4);
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            cursor: not-allowed;
            opacity: 0.7;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .heart-bar.unlocked {
            background: rgba(0, 123, 255, 0.7);
            border-color: #007bff;
            opacity: 1;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Oyun Ortak UI */
        .game-header { width: 100%; padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); align-items: center;}
        .back-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        /* Oyun 4 (Eşleştirme) */
        #game4-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; width: 100%; max-height: 520px; overflow-y: auto; }
        .card { width: 100%; aspect-ratio: 3/5; background: #555; border-radius: 8px; cursor: pointer; background-size: cover; background-position: center; }
        
        /* Oyun 3 (Bul Karayı Al Parayı) */
        #game3-area { display: flex; justify-content: center; gap: 12px; padding: 20px; width: 100%; margin-top: 30px; }
        .card3 { width: 28%; aspect-ratio: 9/16; background: url('kart-arka-yuz.png'); background-size: cover; background-position: center; border-radius: 8px; cursor: pointer; transition: transform 0.4s ease-in-out; }
        .shuffling { animation: shuffleAnim 0.4s ease-in-out infinite alternate; }
        @keyframes shuffleAnim {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-15px) scale(1.05) rotate(4deg); }
            100% { transform: translateY(15px) scale(0.95) rotate(-4deg); }
        }
        .msg-text { margin-top: 20px; font-size: 18px; text-align: center; padding: 0 10px; }

        /* Oyun 2 (Gece/Gündüz) */
        #game2-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; width: 100%; }
        .char-box { text-align: center; font-size: 11px; font-weight: bold; }
        .char-img { width: 100%; aspect-ratio: 3/5; background-size: cover; background-position: center; border-radius: 6px; background-color: #333; transition: filter 0.5s ease, opacity 0.5s ease; }
        .char-img.eliminated { filter: grayscale(100%); opacity: 0.3; }
        #g2-command { font-size: 28px; font-weight: bold; margin: 10px 0; letter-spacing: 2px;}
        .g2-controls { display: flex; gap: 15px; margin-top: 10px; }
        .g2-btn { padding: 12px 25px; font-size: 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold;}
        #btn-gunduz { background: #f1c40f; color: black; }
        #btn-gece { background: #2c3e50; color: white; }

    </style>
</head>
<body>

<div id="phone">
    <!-- KİLİT EKRANI -->
    <div id="lock-screen" class="screen active">
        <h2>🔒 Telefon Kilitli</h2><br>
        <input type="password" id="passInput" placeholder="Şifre">
        <button onclick="checkPassword()">Kilidi Aç</button>
    </div>

    <!-- ANA EKRAN -->
    <div id="home-screen" class="screen">
        <div class="score-board">Toplam Puan: <span id="totalScore">0</span></div>
        <div class="apps">
            <div class="app-icon" onclick="initGame4()">4. Hafıza Kartları (4 Puan)</div>
            <div class="app-icon" onclick="initGame3()">3. Bul Karayı (3 Puan)</div>
            <div class="app-icon" onclick="initGame2()">2. Gece & Gündüz (2 Puan)</div>
            <div class="app-icon" onclick="showScreen('game1-screen')">1. Kalp Dokunuşu (1 Puan)</div>
            
            <!-- MAVİ KALP BARI -->
            <div id="blue-heart-bar" class="heart-bar" onclick="openBlueHeart()">
                <span id="heart-text">💙 Kilitli (0/10 Puan)</span>
            </div>
        </div>
    </div>

    <!-- OYUN 1 EKRANI -->
    <div id="game1-screen" class="screen">
        <div class="game-header">
            <span>Oyun 1</span>
            <button class="back-btn" onclick="showScreen('home-screen')">Geri</button>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:80%; text-align:center; padding:20px;">
            <h3>💙 Mavi Kalbe Dokun!</h3><br>
            <div style="font-size: 80px; cursor: pointer; user-select: none;" onclick="completeGame(1, 1)">💙</div>
        </div>
    </div>

    <!-- OYUN 4 EKRANI -->
    <div id="game4-screen" class="screen">
        <div class="game-header">
            <span>Oyun 4</span>
            <button class="back-btn" onclick="showScreen('home-screen')">Geri</button>
        </div>
        <div id="game4-grid"></div>
    </div>

    <!-- OYUN 3 EKRANI -->
    <div id="game3-screen" class="screen">
        <div class="game-header">
            <span>Oyun 3</span>
            <button class="back-btn" onclick="showScreen('home-screen')">Geri</button>
        </div>
        <div id="game3-area"></div>
        <div class="msg-text" id="g3-msg">Hedef kartı (bugun.jpg) bul!</div>
    </div>

    <!-- OYUN 2 EKRANI -->
    <div id="game2-screen" class="screen">
        <div class="game-header">
            <span>Oyun 2</span>
            <button class="back-btn" onclick="endGame2()">Geri</button>
        </div>
        <div id="g2-command">BAŞLIYOR...</div>
        <div id="game2-grid"></div>
        <div class="g2-controls">
            <button id="btn-gunduz" class="g2-btn" onclick="setZuanaState('gunduz')">GÜNDÜZ</button>
            <button id="btn-gece" class="g2-btn" onclick="setZuanaState('gece')">GECE</button>
        </div>
    </div>
</div>

<script>
    let totalScore = 0;
    let wonGames = { 1: false, 2: false, 3: false, 4: false };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- ŞİFRE KONTROLÜ ---
    async function checkPassword() {
        let input = document.getElementById('passInput').value;
        try {
            let res = await fetch('password.txt');
            let pass = await res.text();
            if(input.trim() === pass.trim()) {
                showScreen('home-screen');
            } else {
                alert("Yanlış Şifre!");
            }
        } catch(e) {
            alert("password.txt dosyası okunamadı veya yerel sunucu bağlantısı yok!");
        }
    }

    // --- TEK SEFERLİK PUAN KAZANMA SİSTEMİ ---
    function completeGame(gameNum, points) {
        if (!wonGames[gameNum]) {
            wonGames[gameNum] = true;
            totalScore += points;
            document.getElementById('totalScore').innerText = totalScore;
            alert(`Tebrikler! ${points} Puan Kazandın. Toplam Puan: ${totalScore}`);
            checkBlueHeartUnlock();
        } else {
            alert("Tebrikler! Oyunu kazandın. (Bu oyunun puanını daha önce aldığın için puan eklenmedi)");
        }
        showScreen('home-screen');
    }

    // --- MAVİ KALP BARI KONTROLÜ & KİLİT AÇMA ---
    function checkBlueHeartUnlock() {
        let heartBar = document.getElementById('blue-heart-bar');
        let heartText = document.getElementById('heart-text');
        if (totalScore >= 10) {
            heartBar.classList.add('unlocked');
            heartText.innerText = "💙 Mavi Kalp (Kilit Açıldı - Tıkla)";
        } else {
            heartText.innerText = `💙 Kilitli (${totalScore}/10 Puan)`;
        }
    }

    async function openBlueHeart() {
        if (totalScore < 10) {
            alert(`Mavi Kalp henüz kilitli! Kilidi açmak için 10 puana ulaşmalısın. (${totalScore}/10 Puan)`);
            return;
        }
        try {
            let res = await fetch('mavi_kalp.txt');
            let text = await res.text();
            alert(`💙 MAVİ KALP MESAJI 💙\n\n${text}`);
        } catch(e) {
            alert("mavi_kalp.txt dosyası okunamadı veya yerel sunucu bağlantısı yok!");
        }
    }

    // --- OYUN 4: HAFIZA KARTI ---
    let g4_images = ['besinci-mevsim.jpg', 'yanlis-kart.png', 'kis.jpeg', 'yaz.jpg', 'ilkbahar.jpg', 'sonbahar.jpg'];
    let g4_cards = [];
    let g4_flipped = [];
    let g4_matchedCount = 0;

    function initGame4() {
        showScreen('game4-screen');
        g4_flipped = [];
        g4_matchedCount = 0;
        let grid = document.getElementById('game4-grid');
        grid.innerHTML = '';
        
        g4_cards = [...g4_images, ...g4_images].sort(() => Math.random() - 0.5);

        g4_cards.forEach((src, index) => {
            let card = document.createElement('div');
            card.className = 'card';
            card.dataset.src = src;
            card.dataset.index = index;
            card.style.backgroundImage = "url('kart-arka-yuz.png')";
            card.onclick = () => flipCard4(card);
            grid.appendChild(card);
        });
    }

    function flipCard4(card) {
        if (g4_flipped.length >= 2 || g4_flipped.includes(card) || card.classList.contains('matched')) return;

        card.style.backgroundImage = `url('${card.dataset.src}')`;
        g4_flipped.push(card);

        if (g4_flipped.length === 2) {
            setTimeout(checkMatch4, 500);
        }
    }

    function checkMatch4() {
        let card1 = g4_flipped[0];
        let card2 = g4_flipped[1];
        let src1 = card1.dataset.src;
        let src2 = card2.dataset.src;

        if (src1 === src2) {
            if (src1.includes('yanlis-kart.png')) {
                alert("Yanlış kartlar eşleşti! Oyun baştan başlıyor.");
                initGame4();
            } else {
                card1.classList.add('matched');
                card2.classList.add('matched');
                g4_matchedCount += 2;
                g4_flipped = [];
                
                if (g4_matchedCount === 10) completeGame(4, 4);
            }
        } else {
            card1.style.backgroundImage = "url('kart-arka-yuz.png')";
            card2.style.backgroundImage = "url('kart-arka-yuz.png')";
            g4_flipped = [];
        }
    }

    // --- OYUN 3: BUL KARAYI ---
    let g3_images = ['yarin.jpg', 'bugun.jpg', 'dun.jpg'];
    let targetCard = 'bugun.jpg';
    let g3_canClick = false;

    function initGame3() {
        showScreen('game3-screen');
        let area = document.getElementById('game3-area');
        let msg = document.getElementById('g3-msg');
        area.innerHTML = '';
        g3_canClick = false;
        msg.innerText = "Kartlara iyi bak, BUGÜN'ü bulacaksın...";

        let shuffled = [...g3_images].sort(() => Math.random() - 0.5);

        shuffled.forEach((src) => {
            let c = document.createElement('div');
            c.className = 'card3';
            c.style.backgroundImage = `url('${src}')`;
            c.dataset.src = src;
            c.onclick = () => pickCard3(c);
            area.appendChild(c);
        });

        setTimeout(() => {
            msg.innerText = "Karıştırılıyor...";
            let cardsDom = document.querySelectorAll('.card3');
            cardsDom.forEach(c => {
                c.style.backgroundImage = "url('kart-arka-yuz.png')";
                c.classList.add('shuffling');
            });
            
            setTimeout(() => {
                for (let i = area.children.length; i >= 0; i--) {
                    area.appendChild(area.children[Math.random() * i | 0]);
                }
                cardsDom.forEach(c => c.classList.remove('shuffling'));
                msg.innerText = "Hangi kart BUGÜN?";
                g3_canClick = true;
            }, 1500);
        }, 2000);
    }

    function pickCard3(card) {
        if (!g3_canClick) return;
        card.style.backgroundImage = `url('${card.dataset.src}')`;
        g3_canClick = false;

        setTimeout(() => {
            if (card.dataset.src === targetCard) {
                completeGame(3, 3);
            } else {
                alert("Yanlış kart! Baştan başlıyor.");
                initGame3();
            }
        }, 500);
    }

    // --- OYUN 2: GECE GÜNDÜZ ---
    let chars = ['cahit', 'zuana', 'fare', 'keci', 'kedi', 'tavsan', 'zurafa', 'horoz'];
    let activeChars = [];
    let g2_interval;
    let g2_currentCommand = '';
    let zuanaState = 'gunduz';
    
    function initGame2() {
        showScreen('game2-screen');
        activeChars = [...chars];
        renderGame2Grid();
        zuanaState = 'gunduz';
        document.getElementById('g2-command').innerText = "HAZIR OL...";
        setTimeout(nextRound2, 2000);
    }

    function renderGame2Grid() {
        let grid = document.getElementById('game2-grid');
        grid.innerHTML = '';
        chars.forEach(c => {
            let div = document.createElement('div');
            div.className = 'char-box';
            div.innerHTML = `<div class="char-img" id="img-${c}" style="background-image:url('${c}-gunduz.png')"></div><div style="margin-top:3px">${c.toUpperCase()}</div>`;
            grid.appendChild(div);
        });
    }

    function setZuanaState(state) {
        zuanaState = state;
        let imgZuana = document.getElementById('img-zuana');
        if (imgZuana && !imgZuana.classList.contains('eliminated')) {
            imgZuana.style.backgroundImage = `url('zuana-${state}.png')`;
        }
    }

    function nextRound2() {
        if(!document.getElementById('game2-screen').classList.contains('active')) return;

        g2_currentCommand = Math.random() > 0.5 ? 'gunduz' : 'gece';
        let cmdText = document.getElementById('g2-command');
        cmdText.innerText = g2_currentCommand === 'gunduz' ? "☀️ GÜNDÜZ" : "🌙 GECE";
        cmdText.style.color = g2_currentCommand === 'gunduz' ? "#f1c40f" : "#fff";

        chars.forEach(c => {
            if (!activeChars.includes(c) || c === 'zuana') return;
            
            let charState = Math.random() > 0.3 ? g2_currentCommand : (g2_currentCommand === 'gunduz' ? 'gece' : 'gunduz');
            let img = document.getElementById(`img-${c}`);
            img.style.backgroundImage = `url('${c}-${charState}.png')`;
            img.dataset.state = charState;
        });

        g2_interval = setTimeout(checkSurvival2, 1600);
    }

    function checkSurvival2() {
        if(!document.getElementById('game2-screen').classList.contains('active')) return;

        if (zuanaState !== g2_currentCommand) {
            document.getElementById('img-zuana').classList.add('eliminated');
            alert("Zuana yanlış hamle yaptı ve elendi! Oyun Bitti.");
            endGame2();
            return;
        }

        let newlyEliminated = [];
        activeChars.forEach(c => {
            if (c === 'zuana') return;
            let img = document.getElementById(`img-${c}`);
            if (img.dataset.state !== g2_currentCommand) {
                img.classList.add('eliminated');
                newlyEliminated.push(c);
            }
        });

        activeChars = activeChars.filter(c => !newlyEliminated.includes(c));

        if (activeChars.length === 1 && activeChars[0] === 'zuana') {
            completeGame(2, 2);
        } else {
            setTimeout(nextRound2, 1200);
        }
    }

    function endGame2() {
        clearTimeout(g2_interval);
        showScreen('home-screen');
    }
</script>
</body>
</html>
